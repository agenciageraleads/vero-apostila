<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Vero · teste 10s</title>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ground)}
body{font-family:var(--text);color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--ground)}
.abs{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform,opacity}
.h{font-family:var(--display);font-weight:var(--display-weight);letter-spacing:var(--display-tracking);font-size:150px;line-height:1.1}
.m{font-family:var(--mono);font-size:30px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
#slot{position:absolute;left:200px;top:300px;width:1500px;height:190px;overflow:hidden}
#slot .n{position:absolute;left:0;top:0}
#rule{background:var(--accent);border-radius:4px;will-change:transform}
#tile{background:var(--ink);will-change:transform}
#v{width:230px;height:auto}
#hud{position:absolute;right:14px;bottom:10px;font:13px monospace;color:#c00;display:none}
</style></head>
<body><div id="stage">
 <div id="pre" class="abs m">Uma escola para</div>
 <div id="slot"></div>
 <div id="dv" class="abs h" style="font-style:italic">de verdade.</div>
 <div id="rule" class="abs"></div>
 <div id="tile" class="abs"></div>
 <img id="v" class="abs" src="vero-v-gold-hd.png" alt="">
 <div id="brand" class="abs h" style="font-size:190px">Vero.</div>
 <div id="tag" class="abs" style="font-size:44px;font-weight:500;color:var(--ink)">Uma escola para empresários de verdade.</div>
 <div id="hud"></div>
</div>
<script src="motion.js"></script><script src="look.js"></script>
<script>
const DUR=10; window.__meta={dur:DUR,fps:30,w:1920,h:1080};
const {clamp,lerp,sstep,ease}=OM; const $=id=>document.getElementById(id);
const E=ease.expoOut, IO=ease.cubicInOut; const D=(t,a,b)=>clamp((t-a)/(b-a));
// o "de verdade." e a linha dourada ficam parados; só o substantivo troca. No fim a linha vira o tile da marca.
const NOUNS=[['Formação',0.35],['Exemplos',1.75],['Problemas',3.15],['Empresários',4.7]]; const PRE=4.35, C0=7.0;
const slot=$('slot'); const nEls=NOUNS.map(([w])=>{const d=document.createElement('div');d.className='n h';d.textContent=w;slot.appendChild(d);return d;});
const RULE={x:200,y:660,w:820,h:8}, TILE={x:200,y:270,w:440,h:440};
function seek(t){
  NOUNS.forEach(([w,t0],i)=>{ const next=NOUNS[i+1]?NOUNS[i+1][1]:null; const inn=OM.wordRise(t,t0,{dist:70}); let op=inn.op, y=inn.y;
    if(next!==null&&t>=next-0.05){const u=ease.cubicIn?ease.cubicIn(D(t,next-0.05,next+0.28)):D(t,next-0.05,next+0.28); op*=1-u; y-=u*80;}
    if(i===NOUNS.length-1&&t>=C0-0.1){const u=sstep(C0-0.1,C0+0.3,t); op*=1-u;}
    nEls[i].style.opacity=op; nEls[i].style.transform=`translateY(${y.toFixed(1)}px)`; });
  const dv=OM.wordRise(t,0.2,{dist:30}); const gone=sstep(C0-0.1,C0+0.3,t);
  $('dv').style.opacity=dv.op*(1-gone); $('dv').style.transform=`translate(200px,${(480+dv.y).toFixed(1)}px)`;
  const pre=OM.wordRise(t,PRE,{dist:24}); $('pre').style.opacity=pre.op*(1-gone); $('pre').style.transform=`translate(204px,${(250+pre.y).toFixed(1)}px)`;
  slot.style.opacity=1-gone;
  // linha dourada: desenha, e depois vira o tile navy da marca (carry)
  const grow=E(D(t,0.1,1.1)); const m=OM.morphRect(t,C0,C0+0.9,RULE,TILE);
  const r=t<C0?{x:RULE.x,y:RULE.y,w:RULE.w*grow,h:RULE.h}:m; const rl=$('rule'); rl.style.left=r.x+'px';rl.style.top=r.y+'px';rl.style.width=r.w+'px';rl.style.height=r.h+'px';
  const tileOn=sstep(C0+0.15,C0+0.55,t); rl.style.background=tileOn>0.5?'var(--ink)':'var(--accent)'; rl.style.borderRadius=(t<C0?4:lerp(4,36,E(D(t,C0,C0+0.9))))+'px';
  $('tile').style.opacity=0;
  const lg=OM.wordRise(t,C0+0.7,{dist:10}); $('v').style.opacity=lg.op; $('v').style.transform=`translate(${200+(440-230)/2}px,${(270+(440-$('v').offsetHeight)/2+lg.y).toFixed(1)}px) scale(${lg.s.toFixed(4)})`;
  const b=OM.wordRise(t,C0+1.0,{dist:30}); $('brand').style.opacity=b.op; $('brand').style.transform=`translate(720px,${(300+b.y).toFixed(1)}px)`;
  const g=OM.wordRise(t,C0+1.4,{dist:20}); $('tag').style.opacity=g.op; $('tag').style.transform=`translate(724px,${(560+g.y).toFixed(1)}px)`;
  $('hud').textContent='t='+t.toFixed(3); return Promise.resolve();
}
window.__seek=async t=>{await seek(t);return true;};
window.__ready=(window.LOOK?LOOK.ready:Promise.resolve()).then(()=>document.fonts.ready).then(()=>new Promise(r=>{const i=$('v');i.complete?r():i.onload=r;})).then(()=>seek(0));
const q=new URLSearchParams(location.search); if(q.has('t')) __ready.then(()=>seek(parseFloat(q.get('t')))); if(q.has('hud')) $('hud').style.display='block';
if(q.has('play')) __ready.then(()=>{const t0=performance.now();(function loop(){seek(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();});
</script></body></html>
